<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Germany UAS Master Atlas</title>
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css" />
    
    <style>
        body, html { margin: 0; padding: 0; height: 100%; font-family: -apple-system, sans-serif; overflow: hidden; }
        .app { display: flex; height: 100vh; width: 100vw; }
        #sidebar { width: 320px; min-width: 320px; flex-shrink: 0; background: white; border-right: 1px solid #ddd; display: flex; flex-direction: column; z-index: 1000; transition: margin-left 0.3s ease; }
        #map-container { flex: 1; position: relative; height: 100%; }
        #map { width: 100%; height: 100%; z-index: 1; }
        #open-btn { position: absolute; top: 15px; left: 15px; z-index: 1000; display: none; padding: 8px 12px; cursor: pointer; background: white; border: 2px solid rgba(0,0,0,0.2); border-radius: 4px; font-weight: bold; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        #open-btn:hover { background: #f4f4f4; }
        .head { padding: 20px; border-bottom: 1px solid #eee; background: #fafafa; }
        .search-box { width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px; margin-top: 10px; box-sizing: border-box; }
        .list { flex: 1; overflow-y: auto; }
        .item { padding: 10px 20px; border-bottom: 1px solid #f0f0f0; cursor: pointer; font-size: 13px; }
        .item:hover { background: #f0f7ff; }
        .marker-public { background: #059669; border-radius: 50%; border: 2px solid white; }
        .marker-private { background: #d97706; border-radius: 50%; border: 2px solid white; }
        .marker-church { background: #db2777; border-radius: 50%; border: 2px solid white; }
        .city-label { font-size: 14px; font-weight: bold; color: #000; width: 120px !important; text-align: center; margin-left: -60px; margin-top: -10px; pointer-events: none; }
    </style>
</head>
<body>

<div class="app">
    <div id="sidebar">
        <div class="head">
            <div style="display: flex; justify-content: space-between; align-items: center;">
                <h3 style="margin: 0">UAS Master Atlas</h3>
                <button id="close-btn" style="cursor: pointer; border: none; background: none; font-size: 16px;">✖</button>
            </div>
            <input type="text" class="search-box" id="search" placeholder="Filter universities..." />
        </div>
        <div class="list" id="list"></div>
    </div>
    <div id="map-container">
        <button id="open-btn">☰ Menu</button>
        <div id="map"></div>
    </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
<script src="database.js"></script>

<script>
    const map = L.map('map', { zoomControl: false }).setView([51.1657, 10.4515], 6);
    L.control.zoom({ position: 'bottomright' }).addTo(map);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);

    const cityLayer = L.layerGroup().addTo(map);
    CITIES.forEach(city => {
        L.marker([city.lat, city.lon], {
            icon: L.divIcon({ className: 'city-label', html: `<b>${city.name}</b>` })
        }).addTo(cityLayer);
    });

    const markers = L.markerClusterGroup({ chunkedLoading: true, disableClusteringAtZoom: 10, maxClusterRadius: 40 });
    let spiderLines = L.layerGroup().addTo(map);

    function renderApp() {
        markers.clearLayers();
        spiderLines.clearLayers(); 
        
        const q = document.getElementById('search').value.toLowerCase();
        const list = document.getElementById('list');
        list.innerHTML = '';

        UNIS.filter(u => u.name.toLowerCase().includes(q)).forEach(u => {
            const locations = u.campuses ? u.campuses : [{ city: u.city, lat: u.lat, lon: u.lon }];
            let mainMarker = null;

            locations.forEach((loc, index) => {
                let nearestCity = null;
                let minDistance = Infinity;
                CITIES.forEach(city => {
                    const d = map.distance([loc.lat, loc.lon], [city.lat, city.lon]);
                    if (d < minDistance) { minDistance = d; nearestCity = city; }
                });
                const km = Math.round(minDistance / 1000);

                const popupText = `<b>${u.name}</b><br>Campus: ${loc.city}<br><i>Nearest city: ${nearestCity.name} (${km} km)</i>`;
                const icon = L.divIcon({ className: `marker-${u.type}`, iconSize: [10, 10] });
                
                const m = L.marker([loc.lat, loc.lon], {icon})
                           .bindTooltip(popupText, { direction: 'top', offset: [0, -10], opacity: 0.9 })
                           .bindPopup(popupText); 
                
                markers.addLayer(m);
                if (index === 0) mainMarker = m; 
            });

            const div = document.createElement('div');
            div.className = 'item';
            div.innerHTML = `<b>${u.name}</b><br>${u.campuses ? u.campuses.length + ' locations' : u.city}`;
            
            div.onclick = () => { 
                map.closePopup(); 
                spiderLines.clearLayers(); 

                if (u.campuses && u.campuses.length > 1) {
                    const mainLoc = [u.campuses[0].lat, u.campuses[0].lon];
                    for (let i = 1; i < u.campuses.length; i++) {
                        const satellite = [u.campuses[i].lat, u.campuses[i].lon];
                        const line = L.polyline([mainLoc, satellite], { color: '#333', weight: 2, dashArray: '5, 8' });
                        spiderLines.addLayer(line); 
                    }
                }

                map.flyTo(mainMarker.getLatLng(), 14, { duration: 1.5 });
                map.once('moveend', () => { markers.zoomToShowLayer(mainMarker, () => mainMarker.openPopup()); });
            };
            list.appendChild(div);
        });
        
        map.addLayer(markers);
    }

    document.getElementById('search').addEventListener('input', renderApp);

    document.getElementById('close-btn').addEventListener('click', () => {
        document.getElementById('sidebar').style.marginLeft = '-320px';
        document.getElementById('open-btn').style.display = 'block'; 
        setTimeout(() => { map.invalidateSize(); }, 300); 
    });

    document.getElementById('open-btn').addEventListener('click', () => {
        document.getElementById('sidebar').style.marginLeft = '0';
        document.getElementById('open-btn').style.display = 'none'; 
        setTimeout(() => { map.invalidateSize(); }, 300);
    });

    renderApp();
</script>

</body>
</html>
